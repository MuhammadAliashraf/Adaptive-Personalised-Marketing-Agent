services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apma-api
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - apma

  postgres:
    image: postgres:16-alpine
    container_name: apma-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-apma_dev}
    ports:
      - '5432:5432'
    volumes:
      - apma_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - apma

volumes:
  apma_pgdata:

networks:
  apma:
    driver: bridge
